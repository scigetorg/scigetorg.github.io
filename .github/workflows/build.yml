name: Build

# Proves the site still builds. Cloudflare Pages does the actual deploy; this
# exists so dependency-bump PRs (Renovate) have something to go green against.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Deliberately blocking: the overrides in pnpm-workspace.yaml hold several
      # CVE pins in place, so a regression there needs to turn the build red
      # rather than merge quietly on a dependency bump.
      - run: pnpm audit --audit-level high
