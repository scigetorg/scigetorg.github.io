name: Build

# Proves the site still builds. Cloudflare Pages does the actual deploy; this
# exists so dependency-bump PRs (Renovate) have something to go green against.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install requests

      - run: python -B -m unittest discover -s tests

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - run: pnpm check:links

      # Deliberately blocking: the overrides in pnpm-workspace.yaml hold several
      # CVE pins in place, so a regression there needs to turn the build red
      # rather than merge quietly on a dependency bump.
      - run: pnpm audit --audit-level high
