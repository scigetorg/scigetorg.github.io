allowBuilds:
  esbuild: true
  sharp: true

# Force patched versions of transitive deps flagged by `pnpm audit`.
# Astro/Starlight pull these in indirectly and lag the fixed releases.
overrides:
  '@babel/core': ^8.0.0
  js-yaml: ^4.3.2
  postcss: ^8.5.25
  sharp: ^0.35.5
  svgo: ^4.1.0
  nanoid@3: ^3.3.18
  source-map-js: ^1.2.2

auditConfig:
  ignoreGhsas:
    # picomatch ReDoS via attacker-supplied extglob patterns. Every release
    # through 4.0.7 is affected and the advisory lists no patched version yet.
    # The build only matches globs from this repo's own config, so there is no
    # untrusted pattern to exploit. Remove once a fixed picomatch ships.
    - GHSA-fc5q-39xc-vjpf
